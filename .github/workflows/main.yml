name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android project structure
        run: flutter create . --platforms=android --org com.example.vocabapp

      - name: Force API level 34 in build.gradle
        run: |
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            echo "File found, updating SDK versions..."
            sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' "$BUILD_FILE"
            sed -i 's/compileSdk =.*/compileSdk = 34/g' "$BUILD_FILE"
            sed -i 's/compileSdk:.*/compileSdk: 34/g' "$BUILD_FILE"
            sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' "$BUILD_FILE"
            sed -i 's/targetSdk =.*/targetSdk = 34/g' "$BUILD_FILE"
          else
            echo "build.gradle not found!"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
