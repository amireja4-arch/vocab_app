name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Platform Files
        run: flutter create --platforms=android .

      - name: Fix compileSdkVersion to 34
        run: |
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          import re
          content = re.sub(r'compileSdk\s*=?:?\s*\d+', 'compileSdk 34', content)
          content = re.sub(r'compileSdkVersion\s*=?:?\s*\d+', 'compileSdkVersion 34', content)
          content = re.sub(r'targetSdk\s*=?:?\s*\d+', 'targetSdk 34', content)
          content = re.sub(r'targetSdkVersion\s*=?:?\s*\d+', 'targetSdkVersion 34', content)
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
